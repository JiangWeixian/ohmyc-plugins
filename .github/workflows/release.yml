name: Release
on:
  push:
    branches:
      - main
      - master
      - "releases/*"
  workflow_dispatch:
    inputs:
      branch:
        description: Publish this branch to the snapshot dist-tag. This does not publish latest.
        required: true
        default: main
        type: string
env:
  CI: true
jobs:
  release:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout code repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout snapshot branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        name: Install bun
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # setup-node writes `_authToken=${NODE_AUTH_TOKEN}`. An empty value still
      # counts as auth, so npm skips the OIDC exchange and publish 404s.
      - name: Let npm publish use OIDC
        run: |
          version="$(npm --version)"
          echo "npm ${version} ($(command -v npm))"
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) { console.error("trusted publishing needs npm >= 11.5.1"); process.exit(1) }' "$version"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - name: create and publish versions
        if: github.event_name != 'workflow_dispatch'
        uses: changesets/action@v1
        with:
          version: bun run ci:version
          commit: "chore: update versions"
          title: "chore: update versions"
          publish: bun run ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and publish snapshot versions
        if: github.event_name == 'workflow_dispatch'
        run: |
          bun run ci:snapshot
          bun run ci:prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
